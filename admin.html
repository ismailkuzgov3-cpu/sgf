<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Админ-панель — Арсамак</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="logo">🔥 Климат <span>Комфорт</span></div>
  <div class="nav-links">
    <a href="index.html">Каталог</a>
    <a onclick="logout()" style="cursor:pointer">Выйти</a>
  </div>
</header>

<div style="padding:30px;max-width:1300px;margin:0 auto;">

  <div class="admin-header">
    <div>
      <div class="role">РУКОВОДИТЕЛЬ</div>
      <h1>👑 Арсамак</h1>
      <p style="opacity:.7;font-size:14px;margin-top:6px;">Панель управления магазином «Климат Комфорт»</p>
    </div>
    <div style="text-align:right;">
      <div style="font-size:36px;">📊</div>
      <div id="stats" style="font-size:13px;opacity:.8;"></div>
    </div>
  </div>

  <div class="admin-tools">
    <input id="searchAdmin" placeholder="🔍 Поиск товара..." oninput="renderAdminTable()">
    <select id="catFilter" onchange="renderAdminTable()">
      <option value="">Все категории</option>
    </select>
    <button onclick="openModal()">➕ Добавить товар</button>
  </div>

  <table class="admin-table">
    <thead>
      <tr>
        <th>ID</th><th>Фото</th><th>Название</th><th>Категория</th>
        <th>Цена</th><th>Старая цена</th><th>Действия</th>
      </tr>
    </thead>
    <tbody id="adminTable"></tbody>
  </table>
</div>

<!-- МОДАЛКА -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <h2 id="modalTitle" style="margin-bottom:20px;">Добавить товар</h2>
    <input type="hidden" id="m_id">
    <label>Название</label>
    <input id="m_name">
    <label>Категория</label>
    <input id="m_category" list="catList">
    <datalist id="catList"></datalist>
    <label>Цена (₽)</label>
    <input id="m_price" type="number">
    <label>Старая цена (₽, можно 0)</label>
    <input id="m_oldPrice" type="number">
    <label>URL фото</label>
    <input id="m_img" placeholder="https://...">
    <label>Описание</label>
    <input id="m_desc">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Отмена</button>
      <button class="btn-save" onclick="saveProduct()">Сохранить</button>
    </div>
  </div>
</div>

<script src="js/products.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
